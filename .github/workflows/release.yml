name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (for example 1.5.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Build draft release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate version and tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch."
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Enter a version such as 1.5.0, without the v prefix."
            exit 1
          fi

          app_version=$(sed -nE 's/^[[:space:]]*Version: "v([0-9]+\.[0-9]+\.[0-9]+)",$/\1/p' cmd/root.go)
          if [[ "$app_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::Requested version $RELEASE_VERSION does not match cmd/root.go ($app_version)."
            exit 1
          fi

          # A failed remote lookup must fail validation, rather than imply an unused tag.
          existing_tag=$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag v$RELEASE_VERSION already exists."
            exit 1
          fi

          echo "Version v$RELEASE_VERSION matches the app and its tag is available."
          echo "Validated v$RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$RELEASE_VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" version "] - ") == 1) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if ! grep -qE '^[-*] ' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No release notes found in CHANGELOG.md for $RELEASE_VERSION."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release archives and checksums
        run: make release VERSION="$RELEASE_VERSION"

      - name: Verify archive checksums
        working-directory: dist/v${{ inputs.version }}
        run: shasum -a 256 -c checksums.txt

      - name: Upload release files
        uses: actions/upload-artifact@v6
        with:
          name: skytui-v${{ inputs.version }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/v${{ inputs.version }}/skytui_${{ inputs.version }}_darwin_arm64.tar.gz
            dist/v${{ inputs.version }}/skytui_${{ inputs.version }}_darwin_amd64.tar.gz
            dist/v${{ inputs.version }}/skytui_${{ inputs.version }}_linux_arm64.tar.gz
            dist/v${{ inputs.version }}/skytui_${{ inputs.version }}_linux_amd64.tar.gz
            dist/v${{ inputs.version }}/skytui_${{ inputs.version }}_windows_amd64.zip
            dist/v${{ inputs.version }}/checksums.txt

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="dist/v$RELEASE_VERSION"
          release_url=$(gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "SkyTUI v$RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$release_dir/skytui_${RELEASE_VERSION}_darwin_arm64.tar.gz" \
            "$release_dir/skytui_${RELEASE_VERSION}_darwin_amd64.tar.gz" \
            "$release_dir/skytui_${RELEASE_VERSION}_linux_arm64.tar.gz" \
            "$release_dir/skytui_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "$release_dir/skytui_${RELEASE_VERSION}_windows_amd64.zip" \
            "$release_dir/checksums.txt")

          echo "Draft release: $release_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the notes and six attached files, then publish the draft manually. Homebrew is a separate step." >> "$GITHUB_STEP_SUMMARY"
